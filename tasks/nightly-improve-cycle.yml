schedule: "0 2 * * *"
enabled: true
timeoutMs: 1800000
name: nightly-improve-cycle
description: "Nightly extract + improve pass: harvests session knowledge and queues improvement proposals without modifying live assets."
when_to_use: "Use when the stash should run a nightly pass that harvests session knowledge and proposes reusable updates without directly modifying live assets."
tags:
  - scheduled
  - improve
  - extract
  - proposals
updated: 2026-06-01
prompt: |
  Run a non-destructive nightly extract and improvement pass for the current AKM stash.

  1. Verify the installed `akm` supports `improve`, `extract`, and `proposals`.
  2. Inspect the current queue with `akm proposals --status pending --format json`.
     Record the pending count before the run.
  3. Harvest session knowledge from all available harnesses:

      akm extract --auto --since 24h

  4. Run one whole-stash improve pass without auto-accept:

      akm improve --auto-accept=false --task "Review the current stash for stale guidance, outdated CLI references, missing task-asset coverage, and reusable improvements. Generate only proposal-queue entries; do not edit live assets directly."

  5. Check the queue again with `akm proposals --status pending --format json`.
  6. Do not accept or reject proposals automatically.
  7. Finish with a concise summary that includes:
     - pending proposal count before and after,
     - whether extract and improve both succeeded,
     - the next review command (`akm proposals` or `akm show proposal <id>`).

  If `akm improve` or `akm extract` is unavailable, stop and report that the
  environment is on an older AKM version.
