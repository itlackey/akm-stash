version: 4
name: nightly-improve-cycle
description: "Nightly extract + improve pass: harvests session knowledge and
  runs improve; proposals that fail its quality check stay pending for review."
when_to_use: "Use when the stash should run a nightly pass that harvests session
  knowledge and proposes reusable updates, leaving anything improve does not
  accept for a person to review."
tags:
  - scheduled
  - improve
  - extract
  - proposals
uses: akm/command
with:
  content: |
    Run a nightly extract and improvement pass for the current AKM stash.

    1. Verify the installed `akm` supports `improve`, `proposal extract`, and `proposal`.
    2. Inspect the current queue with `akm proposal list --status pending --format json`.
       Record the pending count before the run.
    3. Harvest session knowledge from all available harnesses:

        akm proposal extract --auto --since 24h

    4. Run one whole-stash improve pass:

        akm improve --no-sync --no-push --task "Review the current stash for stale guidance, outdated CLI references, missing task-asset coverage, and reusable improvements."

    5. Check the queue again with `akm proposal list --status pending --format json`.
    6. Do not accept or reject proposals yourself. `akm improve` accepts only the
       proposals whose quality check passed; leave the rest pending.
    7. Finish with a concise summary that includes:
       - pending proposal count before and after,
       - whether extract and improve both succeeded,
       - the next review command (`akm proposal list` or `akm proposal show <id>`).

    If `akm improve` or `akm proposal extract` is unavailable, stop and report that the
    environment is on an older AKM version.
schedule:
  - cron: "0 2 * * *"
timeout: 30m
